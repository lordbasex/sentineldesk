# Production on Linux with an Intel/AMD GPU — VA-API (H.264 in hardware).
# Passes /dev/dri into the container; the driver (iHD/mesa) is already in the image.
#
#   AUTH_USER=admin AUTH_PASS=secret docker compose -f docker-compose.vaapi.yml up -d
#   with TLS: ... --profile tls up -d
services:
  sentineldesk:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # The Dockerfile's last stage is `full`, so without this a bare `--build`
      # builds full and tags it sentineldesk:latest — a name that means lite
      # everywhere else. Reasoned out in deploy/docker-compose.yml.
      target: desktop
    image: sentineldesk:latest
    container_name: sentineldesk
    network_mode: host
    # A VPN client needs a tunnel device and the capability to configure
    # routes. Without both, openvpn and wg install fine and then fail at the
    # moment somebody actually needs them.
    #
    # NET_ADMIN is a real grant, worth naming: it lets the container manage its
    # own network stack — interfaces, routes, iptables. Drop both lines on a
    # deployment that never dials a VPN.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
      - /dev/dri:/dev/dri
    environment:
      - DISPLAY_WIDTH=${DISPLAY_WIDTH:-1920}
      - DISPLAY_HEIGHT=${DISPLAY_HEIGHT:-1080}
      - FPS=${FPS:-60}
      - ENCODER=auto            # detects VA-API; force it with ENCODER=vaapi
      - VIDEO_BITRATE_KBPS=${VIDEO_BITRATE_KBPS:-8000}
      - AUTH_USER=${AUTH_USER:?set AUTH_USER}
      - AUTH_PASS=${AUTH_PASS:?set AUTH_PASS}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - CLIENT_STUN=stun:stun.l.google.com:19302
      # Native TLS in the backend: TLS_SELFSIGNED=1 (self-signed) or TLS_CERT/TLS_KEY
      - TLS_SELFSIGNED=${TLS_SELFSIGNED:-0}
      - TLS_CERT=${TLS_CERT:-}
      - TLS_KEY=${TLS_KEY:-}
      - TLS_HOSTS=${TLS_HOSTS:-}
      # Clock and keyboard, read at start so one image serves every region.
      # TZ: a tzdata name (America/Argentina/Buenos_Aires, Europe/Madrid…).
      # KEYBOARD_LAYOUT: an X layout code — us, es (Spain), latam, pt, fr, de…
      - TZ=${TZ:-UTC}
      - KEYBOARD_LAYOUT=${KEYBOARD_LAYOUT:-us}
      - KEYBOARD_VARIANT=${KEYBOARD_VARIANT:-}
    volumes:
      - sentineldesk-home:/home/sentineldesk
      - ./certs:/certs:ro
      # Put your background images in ./wallpaper/ (see wallpaper/README.md)
      - ./wallpaper:/wallpaper:ro
    shm_size: "2g"
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    container_name: webrtc-caddy
    profiles: ["tls"]
    network_mode: host
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    volumes:
      # auto (Let's Encrypt) | selfsigned | custom (wildcard propio) | wildcard (LE DNS-01)
      - ./deploy/Caddyfile.${TLS_MODE:-auto}:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  sentineldesk-home:
  caddy_data:
  caddy_config:
