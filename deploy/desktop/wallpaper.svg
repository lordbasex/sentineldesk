<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Wallpaper de reserva (ondas suaves, tonos frambuesa). Poné el tuyo en ./wallpaper/ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf4"/>
      <stop offset=".55" stop-color="#dfe6ef"/>
      <stop offset="1" stop-color="#cfd9e6"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c51a4a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8c1238" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0466f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c51a4a" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75b743" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4e8a2a" stop-opacity=".4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- onda verde (hoja) al fondo -->
  <path d="M0,760 C 380,660 640,880 980,800 C 1320,720 1560,900 1920,780 L1920,1080 L0,1080 Z"
        fill="url(#w3)" filter="url(#soft)"/>

  <!-- onda frambuesa clara -->
  <path d="M0,850 C 340,760 700,960 1040,880 C 1380,800 1620,980 1920,870 L1920,1080 L0,1080 Z"
        fill="url(#w2)" filter="url(#soft)"/>

  <!-- onda frambuesa principal -->
  <path d="M0,940 C 360,860 720,1040 1080,960 C 1440,880 1680,1040 1920,950 L1920,1080 L0,1080 Z"
        fill="url(#w1)"/>

  <!-- destellos suaves arriba -->
  <circle cx="1560" cy="180" r="220" fill="#ffffff" opacity=".18" filter="url(#soft)"/>
  <circle cx="300" cy="120" r="150" fill="#ffffff" opacity=".12" filter="url(#soft)"/>
</svg>
