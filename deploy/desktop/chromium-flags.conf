# Chromium flags for running inside the container:
# - no kernel sandbox (user namespaces are not available here)
# - a small /dev/shm
# - CDP on 9222: the browser_* tools drive the real DOM instead of the picture
# - forced accessibility: the web UI also shows up in the AT-SPI tree (ui_*)
export CHROMIUM_FLAGS="$CHROMIUM_FLAGS --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins=* --force-renderer-accessibility"
