; WHO THE DESKTOP RUNS AS, told to this file from outside.
;
;   DESKTOP_USER   the account every program drops to
;   DESKTOP_HOME   its home directory
;   RUNTIME_DIR    its XDG runtime directory
;
; Whatever starts supervisord exports all three: deploy/config/entrypoint.sh in
; the container, /usr/local/bin/sentineldesk-session on a native install. Leave
; one unset and supervisord refuses to expand it and stops with an error naming
; the variable, which is the right way to fail.
;
; They were the literals sentineldesk, /home/sentineldesk and /run/user/1000,
; ten times each, and that is what kept the native installer off any machine
; with a person on it. useradd hands 1000 to the first real user on Debian,
; Ubuntu and Raspberry Pi OS alike, so the installer had to refuse when it was
; taken — leaving native mode working only on a box with nothing but root.
;
; Pointing a second user at /run/user/1000 anyway is not the answer:
; systemd-logind owns that directory for whoever actually IS uid 1000 and
; recreates it on their every login, so PulseAudio and D-Bus would be sharing a
; path with a process that has its own ideas about it. The directory follows the
; user instead. (An installation that runs as an EXISTING account needs
; `loginctl enable-linger` for the same reason, and the installer does it.)
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; The control socket: without it `supervisorctl` has nothing to talk to, and the
; MCP's service_control tool (restarting X, audio, the WM) can do nothing.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx24 -ac -nolisten tcp -noreset
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s"
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulseaudio]
command=/usr/bin/pulseaudio -n --file=/etc/pulse/sentineldesk.pa --daemonize=no --exit-idle-time=-1 --disallow-exit
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s"
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; A D-Bus session bus at a FIXED address: AT-SPI and every application have to
; share it for the accessibility tree (the ui_* tools) to work.
[program:dbus-session]
command=/usr/bin/dbus-daemon --session --address=unix:path=%(ENV_RUNTIME_DIR)s/bus --nofork --nopidfile
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s"
priority=15
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; The accessibility bus: it publishes AT_SPI_BUS on the root window; GTK/Qt
; applications register there and expose their UI as a queryable tree.
[program:at-spi]
command=/usr/local/bin/wait-x11.sh /usr/libexec/at-spi-bus-launcher --launch-immediately
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_RUNTIME_DIR)s/bus"
priority=25
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/local/bin/wait-x11.sh /usr/bin/openbox
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",PULSE_SERVER="unix:%(ENV_RUNTIME_DIR)s/pulse/native",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_RUNTIME_DIR)s/bus",GTK_MODULES="gail:atk-bridge",NO_AT_BRIDGE="0",QT_ACCESSIBILITY="1"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:desktop-init]
# Waits for X like everything else that touches the display. It used to start
# immediately, which was harmless while it only copied files into the home —
# and became a race the moment it started applying the keyboard layout, which
# needs a server to apply it to.
command=/usr/local/bin/wait-x11.sh /usr/local/bin/desktop-init.sh
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0"
priority=35
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Desktop icons and wallpaper: pcmanfm in desktop mode owns the root window.
[program:pcmanfm-desktop]
command=/usr/local/bin/wait-wm.sh /usr/bin/pcmanfm --desktop --profile LXDE
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",PULSE_SERVER="unix:%(ENV_RUNTIME_DIR)s/pulse/native"
priority=40
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; The top panel: menu, launchers, task bar and clock
; Wallpaper rotation. Separate from pcmanfm on purpose: it is a timer, not part
; of the desktop, and it exits by itself when there is nothing to rotate — which
; is why autorestart is false. Restarting a process that decided it has no work
; would loop forever.
[program:wallpaper-rotate]
command=/usr/local/bin/wallpaper-rotate.sh
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s"
priority=45
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; lxpanel is the one program here whose stderr does not go to the container log,
; and it earned the exception by measurement: 171 GLib-GIO-CRITICAL lines in 311
; milliseconds at every start, then silence. Counted at 15 s and again at 60 s —
; 171 both times, delta zero. A burst, not a leak.
;
; They are lxpanel asking GLib for file attributes it never requested in the
; query (standard::is-symlink 144 times, plus size, content-type, edit-name,
; is-hidden, is-backup). That is a bug in lxpanel 0.11.1 / libfm 1.4.0, not a
; missing dependency: installing desktop-file-utils and rebuilding the desktop
; database changed the count by exactly zero. Fixing it properly means forking a
; system library to buy back a third of a second of log, which is not a trade
; worth making, and upstream is where it belongs.
;
; So the noise moves rather than disappearing. stderr goes to a file INSIDE the
; container, capped and rotated once — still there for anybody diagnosing a
; panel that genuinely broke, just not on top of `docker compose up`. This is
; the cost of the decision and it should be stated plainly: a real lxpanel
; failure now needs `docker exec … cat /var/log/sentineldesk/lxpanel.err`
; instead of scrolling. stdout still goes to the container log, so anything
; lxpanel says on the normal channel is as visible as it ever was.
[program:lxpanel]
command=/usr/local/bin/wait-wm.sh /usr/bin/lxpanel --profile LXDE
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",PULSE_SERVER="unix:%(ENV_RUNTIME_DIR)s/pulse/native"
priority=45
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=false
stderr_logfile=/var/log/sentineldesk/lxpanel.err
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

[program:sentineldesk]
command=/usr/local/bin/wait-x11.sh /usr/local/bin/sentineldesk
user=%(ENV_DESKTOP_USER)s
environment=HOME="%(ENV_DESKTOP_HOME)s",DISPLAY=":0",XDG_RUNTIME_DIR="%(ENV_RUNTIME_DIR)s",PULSE_SERVER="unix:%(ENV_RUNTIME_DIR)s/pulse/native",MCP_SOCK="%(ENV_RUNTIME_DIR)s/sentineldesk-mcp.sock",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_RUNTIME_DIR)s/bus",GTK_MODULES="gail:atk-bridge",NO_AT_BRIDGE="0",QT_ACCESSIBILITY="1"
priority=50
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
