[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; The control socket: without it `supervisorctl` has nothing to talk to, and the
; MCP's service_control tool (restarting X, audio, the WM) can do nothing.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx24 -ac -nolisten tcp -noreset
user=sentineldesk
environment=HOME="/home/sentineldesk"
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulseaudio]
command=/usr/bin/pulseaudio -n --file=/etc/pulse/sentineldesk.pa --daemonize=no --exit-idle-time=-1 --disallow-exit
user=sentineldesk
environment=HOME="/home/sentineldesk",XDG_RUNTIME_DIR="/run/user/1000"
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; A D-Bus session bus at a FIXED address: AT-SPI and every application have to
; share it for the accessibility tree (the ui_* tools) to work.
[program:dbus-session]
command=/usr/bin/dbus-daemon --session --address=unix:path=/run/user/1000/bus --nofork --nopidfile
user=sentineldesk
environment=HOME="/home/sentineldesk",XDG_RUNTIME_DIR="/run/user/1000"
priority=15
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; The accessibility bus: it publishes AT_SPI_BUS on the root window; GTK/Qt
; applications register there and expose their UI as a queryable tree.
[program:at-spi]
command=/usr/local/bin/wait-x11.sh /usr/libexec/at-spi-bus-launcher --launch-immediately
user=sentineldesk
environment=HOME="/home/sentineldesk",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus"
priority=25
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/local/bin/wait-x11.sh /usr/bin/openbox
user=sentineldesk
environment=HOME="/home/sentineldesk",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000",PULSE_SERVER="unix:/run/user/1000/pulse/native",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus",GTK_MODULES="gail:atk-bridge",NO_AT_BRIDGE="0",QT_ACCESSIBILITY="1"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:desktop-init]
command=/usr/local/bin/desktop-init.sh
user=sentineldesk
environment=HOME="/home/sentineldesk",DISPLAY=":0"
priority=35
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Desktop icons and wallpaper: pcmanfm in desktop mode owns the root window.
[program:pcmanfm-desktop]
command=/usr/local/bin/wait-wm.sh /usr/bin/pcmanfm --desktop --profile LXDE
user=sentineldesk
environment=HOME="/home/sentineldesk",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000",PULSE_SERVER="unix:/run/user/1000/pulse/native"
priority=40
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; The top panel: menu, launchers, task bar and clock
; Wallpaper rotation. Separate from pcmanfm on purpose: it is a timer, not part
; of the desktop, and it exits by itself when there is nothing to rotate — which
; is why autorestart is false. Restarting a process that decided it has no work
; would loop forever.
[program:wallpaper-rotate]
command=/usr/local/bin/wallpaper-rotate.sh
user=sentineldesk
environment=HOME="/home/sentineldesk",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000"
priority=45
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:lxpanel]
command=/usr/local/bin/wait-wm.sh /usr/bin/lxpanel --profile LXDE
user=sentineldesk
environment=HOME="/home/sentineldesk",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000",PULSE_SERVER="unix:/run/user/1000/pulse/native"
priority=45
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sentineldesk]
command=/usr/local/bin/wait-x11.sh /usr/local/bin/sentineldesk
user=sentineldesk
environment=HOME="/home/sentineldesk",DISPLAY=":0",XDG_RUNTIME_DIR="/run/user/1000",PULSE_SERVER="unix:/run/user/1000/pulse/native",MCP_SOCK="/run/user/1000/sentineldesk-mcp.sock",DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus",GTK_MODULES="gail:atk-bridge",NO_AT_BRIDGE="0",QT_ACCESSIBILITY="1"
priority=50
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
