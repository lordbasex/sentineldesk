<!--
  This page used to carry the installation instructions. They now live in the
  user guide, which had most of them already and in more depth — TLS,
  certificates, the variable tables, connecting an agent — while this page was
  the only place that documented installing on a machine of its own. Two
  half-overlapping accounts of the same thing is how documentation starts
  disagreeing with itself, so there is one now.

  Kept as a redirect rather than deleted: the address is published, linked from
  the project site and probably bookmarked, and a 404 helps nobody. ?lang= is
  carried across, because the guide honours it too.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installation — SentinelDesk</title>
<link rel="canonical" href="guide/index.html#install">
<script>
  // Before the meta refresh, so the language survives the hop and the reader
  // does not land in English having asked for Portuguese.
  (function () {
    var lang = new URLSearchParams(location.search).get('lang');
    var to = 'guide/index.html' + (lang ? '?lang=' + encodeURIComponent(lang) : '') + '#install';
    location.replace(to);
  })();
</script>
<meta http-equiv="refresh" content="0; url=guide/index.html#install">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background: #0b0e14; color: #93a09a;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: #4f8ef7; }
</style>
</head>
<body>
  <p>The installation guide has moved —
     <a href="guide/index.html#install">continue to the user guide</a>.</p>
</body>
</html>
